<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Brett Grimm — Portfolio" />
    <title>Brett Grimm — Portfolio</title>

    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Brett Grimm</h1>
    </header>

    <main role="main">
        <div class="row">
            <div class="column left">
                <h2>Performed</h2>
                <p>
                    Lorem, ipsum dolor sit amet consectetur adipisicing elit. Error libero doloremque, incidunt explicabo beatae consequuntur quis suscipit eos dicta a facere eveniet rem aliquam iure quasi ipsum accusantium cupiditate ea?
                </p>
            </div>
            <div class="column center">
                <h2>Composed</h2>
            </div>
            <div class="column right">
                <h2>Produced</h2>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Brett Grimm</p>
    </footer>

    <script>
        // Simple script to keep footer year up to date
        document.getElementById('year').textContent = new Date().getFullYear();

        // Column expansion functionality
        const columns = document.querySelectorAll('.column');
        columns.forEach(column => {
            column.addEventListener('click', function() {
                // Remove active class from all columns
                columns.forEach(col => col.classList.remove('active', 'inactive'));
                // Add active class to clicked column
                this.classList.add('active');
                // Add inactive class to other columns
                columns.forEach(col => {
                    if (col !== this) {
                        col.classList.add('inactive');
                    }
                });
            });
        });
    </script>
</body>
</html>
